# Reference only; the active config is generated at runtime from nginx.conf.template (envsubst).
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name dscc-buriniyozov.norwayeast.cloudapp.azure.com 4.235.97.58;
         # Required for Let's Encrypt SSL certificate renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Docker health check endpoint
        location /health/ {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location / {
            # Force HTTP traffic (including direct IP hits) onto the HTTPS endpoint with the DNS name
            return 301 https://dscc-buriniyozov.norwayeast.cloudapp.azure.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name dscc-buriniyozov.norwayeast.cloudapp.azure.com;
        charset utf-8;

        ssl_certificate /etc/nginx/ssl/live/dscc-buriniyozov.norwayeast.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/dscc-buriniyozov.norwayeast.cloudapp.azure.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
